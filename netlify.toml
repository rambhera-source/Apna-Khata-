[build]
  command = "git clone https://github.com/flutter/flutter.git -b stable --depth 1 && ./flutter/bin/flutter create . --platforms web && ./flutter/bin/flutter pub get && ./flutter/bin/flutter pub run build_runner build --delete-conflicting-outputs && ./flutter/bin/flutter build web --release"
  publish = "build/web"

[build.environment]
  NODE_VERSION = "20"

