name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Fix / Regenerate Android Project Folder
        run: |
          flutter create -t app temp_proj
          rm -rf android
          cp -r temp_proj/android android
          rm -rf temp_proj

      - name: Force Kotlin Version to 1.8.10
        run: |
          # build.gradle में वर्शन अपडेट करें
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.8.10'/g" android/build.gradle
          fi
          
          # settings.gradle या अन्य फाइलों में अगर पुराना 1.7.10 वर्शन है तो उसे भी ठीक करें
          find . -name "*.gradle" -type f -exec sed -i "s/1.7.10/1.8.10/g" {} +
          find . -name "*.gradle.kts" -type f -exec sed -i "s/1.7.10/1.8.10/g" {} +

      - name: Install dependencies
        run: flutter pub get

      - name: Run Isar Code Generator
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Check APK File
        run: |
          ls -lah build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
