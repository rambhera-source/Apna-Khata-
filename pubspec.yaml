name: accounting_app
description: "A fast and smooth mobile/desktop accounting application."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  isar: ^3.1.0+1
  path_provider: ^2.1.2
  intl: ^0.18.1
  provider: ^6.1.1
  excel: ^4.0.3
  file_picker: ^8.0.0
  csv: ^6.0.0

  # PDF generation aur WhatsApp sharing ke liye
  pdf: ^3.10.4
  printing: ^5.11.1
  share_plus: ^7.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true